<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Victory vs Rage V5 Ultimate</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:16px;
    overflow-x:hidden;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 0 20px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    color:#facc15;
    margin-bottom:25px;
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input{

    width:100%;

    height:52px;

    padding:12px;

    margin-bottom:15px;

    border:none;

    border-radius:10px;

    background:#f8fafc;

    font-size:17px;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#facc15;

    font-weight:bold;

    font-size:18px;

    cursor:pointer;

    transition:.2s;

}

button:hover{
    background:#fde047;
}

button:active{
    transform:scale(.97);
}

.result{

    text-align:center;

    font-size:36px;

    font-weight:bold;

    min-height:90px;

    display:flex;

    justify-content:center;

    align-items:center;

}

.victory{
    color:#facc15;
}

.rage{
    color:#ef4444;
}

.dashboard{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:15px;

}

.stat{

    background:#334155;

    border-radius:12px;

    padding:15px;

    text-align:center;

}

.stat h3{
    margin-top:0;
    margin-bottom:10px;
    font-size:16px;
}

.big{
    font-size:24px;
    font-weight:bold;
}

.pop{
    animation:pop .5s ease;
}

@keyframes pop{

    0%{
        transform:scale(.7);
        opacity:0;
    }

    60%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

table{

    width:100%;

    border-collapse:collapse;

}

th,
td{

    padding:10px;

    text-align:center;

    border-bottom:
    1px solid #475569;

}

.deleteBtn{

    width:auto;

    padding:8px 12px;

    background:#dc2626;

    color:white;

    font-size:14px;

}

.deleteBtn:hover{
    background:#ef4444;
}

.champion-card{

    border:2px solid gold;

    box-shadow:
    0 0 10px gold,
    0 0 25px rgba(255,215,0,.45);

}

.crown{

    animation:
    crownGlow 1.5s infinite;

}

@keyframes crownGlow{

    0%{
        text-shadow:
        0 0 5px gold;
    }

    50%{
        text-shadow:
        0 0 12px gold,
        0 0 25px gold,
        0 0 40px gold;
    }

    100%{
        text-shadow:
        0 0 5px gold;
    }

}

#celebrationArea{

    min-height:120px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    font-size:82px;

    margin-top:15px;

}

.particle{

    position:fixed;

    width:10px;

    height:10px;

    border-radius:50%;

    pointer-events:none;

    z-index:9999;

}

.shake{
    animation:shake .6s;
}

@keyframes shake{

    0%{
        transform:translateX(0);
    }

    20%{
        transform:translateX(-10px);
    }

    40%{
        transform:translateX(10px);
    }

    60%{
        transform:translateX(-10px);
    }

    80%{
        transform:translateX(10px);
    }

    100%{
        transform:translateX(0);
    }

}

canvas{

    width:100%;

    background:#0f172a;

    border-radius:12px;

    padding:10px;

}

.sad-message{

    font-size:22px;

    font-weight:bold;

    color:#93c5fd;

    text-align:center;

}

@media(max-width:700px){

    .dashboard{
        grid-template-columns:1fr 1fr;
    }

    .result{
        font-size:24px;
    }

}

@media(max-width:500px){

    .dashboard{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>
🏆 VICTORY vs RAGE V5 🔥
</h1>

<div class="card">

<h2>오늘의 대결</h2>

<label>날짜</label>
<input type="date" id="date">

<label>팀빅토리 점수</label>
<input type="number" id="victory">

<label>팀레이지 점수</label>
<input type="number" id="rage">

<button onclick="registerGame()">
⚔️ 결과 등록
</button>

<div id="result" class="result">
승부를 입력하세요
</div>

<div id="celebrationArea"></div>

<div id="specialMessage"></div>

</div>
<div class="card">

<h2>시즌 전적</h2>

<div class="dashboard">

    <div class="stat">
        <h3>🏆 팀빅토리</h3>
        <div id="victoryWins" class="big">
            0승
        </div>
    </div>

    <div class="stat">
        <h3>🔥 팀레이지</h3>
        <div id="rageWins" class="big">
            0승
        </div>
    </div>

    <div class="stat">
        <h3>🤝 무승부</h3>
        <div id="draws" class="big">
            0회
        </div>
    </div>

    <div class="stat">
        <h3>📈 팀빅토리 승률</h3>
        <div id="victoryRate" class="big">
            0%
        </div>
    </div>

    <div class="stat">
        <h3>📈 팀레이지 승률</h3>
        <div id="rageRate" class="big">
            0%
        </div>
    </div>

    <div class="stat">
        <h3>🔥 현재 연승</h3>
        <div id="streak" class="big">
            없음
        </div>
    </div>

    <div class="stat">
        <h3>🏅 최다 연승</h3>
        <div id="bestStreak" class="big">
            0연승
        </div>
    </div>

    <div class="stat champion-card">
        <h3>👑 챔피언</h3>
        <div id="champion" class="big crown">
            없음
        </div>
    </div>

</div>

</div>


<div class="card">

<h2>📊 시즌 승률 그래프</h2>

<canvas
id="rateChart"
width="800"
height="260">
</canvas>

</div>


<div class="card">

<h2>최근 경기</h2>

<table>

<thead>

<tr>
    <th>날짜</th>
    <th>점수</th>
    <th>승자</th>
    <th>삭제</th>
</tr>

</thead>

<tbody id="history">

</tbody>

</table>

</div>

</div>

<script>

let games =
JSON.parse(
localStorage.getItem(
"battleGamesV5"
)
) || [];

function wait(ms){

    return new Promise(
        resolve=>
        setTimeout(resolve,ms)
    );

}

function playTone(freq,duration=120){

    const ctx =
    new (
    window.AudioContext ||
    window.webkitAudioContext
    )();

    const osc =
    ctx.createOscillator();

    const gain =
    ctx.createGain();

    osc.type="triangle";

    osc.frequency.value=freq;

    gain.gain.value=.05;

    osc.connect(gain);

    gain.connect(
        ctx.destination
    );

    osc.start();

    setTimeout(()=>{
        osc.stop();
    },duration);

}

function clickSound(){

    playTone(
        850,
        80
    );

}

function deleteGame(date){

    const ok =
    confirm(
    date +
    " 기록을 삭제할까요?"
    );

    if(!ok){
        return;
    }

    games =
    games.filter(
    g=>g.date!==date
    );

    saveData();

    updateBoard();

}

function saveData(){

    localStorage.setItem(

        "battleGamesV5",

        JSON.stringify(games)

    );

}

/* ===== 중앙 폭죽 ===== */

function launchCenterFireworks(){

    const colors = [

        "#facc15",
        "#ef4444",
        "#22c55e",
        "#3b82f6",
        "#ffffff"

    ];

    for(let i=0;i<140;i++){

        const p =
        document.createElement(
        "div"
        );

        p.className=
        "particle";

        p.style.background=
        colors[
        Math.floor(
        Math.random()
        *
        colors.length
        )
        ];

        p.style.left=
        "50%";

        p.style.top=
        "50%";

        document.body
        .appendChild(p);

        const angle =
        Math.random()
        *
        Math.PI
        *
        2;

        const distance =
        100 +
        Math.random()
        *
        450;

        const x =
        Math.cos(angle)
        *
        distance;

        const y =
        Math.sin(angle)
        *
        distance;

        p.animate(

        [

        {
            transform:
            "translate(0,0)",
            opacity:1
        },

        {
            transform:
            `translate(${x}px,${y}px)`,
            opacity:0
        }

        ],

        {

            duration:
            1200 +
            Math.random()
            *
            800,

            easing:
            "ease-out"

        }

        );

        setTimeout(
        ()=>p.remove(),
        2000
        );

    }

}

async function victoryShow(){

    const area =
    document.getElementById("celebrationArea");

    const icons = ["👑","🏆","🎉","👏"];

    const sounds = [600,800,1000,1200];

    area.innerHTML = "";

    document.body.classList.add("shake");

    setTimeout(()=>{
        document.body.classList.remove("shake");
    },600);

    for(let i=0;i<icons.length;i++){

        area.innerHTML = icons[i];

        playTone(
            sounds[i],
            180
        );

        await wait(700);

    }

    launchCenterFireworks();

    playTone(1400,300);

    await wait(300);

    area.innerHTML =
    "🏆 TEAM VICTORY DOMINATES!";

}

async function rageShow(){

    const area =
    document.getElementById("celebrationArea");

    const icons =
    ["😭","💔","☠️","🥀"];

    area.innerHTML="";

    for(let icon of icons){

        area.innerHTML = icon;

        playTone(
            180,
            250
        );

        await wait(750);

    }

    area.innerHTML =
    "인정😂오늘 조금 게을렀음..";

}

function calculateCurrentStreak(){

    if(games.length===0){
        return "없음";
    }

    const sorted =
    [...games].sort(
    (a,b)=>
    b.date.localeCompare(a.date)
    );

    const latestWinner =
    sorted[0].winner;

    if(latestWinner==="무승부"){
        return "무승부";
    }

    let count = 0;

    for(let game of sorted){

        if(
            game.winner===
            latestWinner
        ){
            count++;
        }else{
            break;
        }

    }

    return (
        latestWinner +
        " " +
        count +
        "연승"
    );

}

function calculateBestStreak(){

    if(games.length===0){
        return 0;
    }

    const sorted =
    [...games].sort(
    (a,b)=>
    a.date.localeCompare(b.date)
    );

    let best = 0;
    let current = 0;
    let previous = null;

    for(let game of sorted){

        if(
            game.winner===
            "무승부"
        ){
            continue;
        }

        if(
            game.winner===
            previous
        ){
            current++;
        }else{
            current=1;
        }

        if(current>best){
            best=current;
        }

        previous=
        game.winner;

    }

    return best;

}

function drawChart(
    victoryRate,
    rageRate
){

    const canvas =
    document.getElementById(
    "rateChart"
    );

    const ctx =
    canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="#ffffff";

    ctx.font=
    "20px Segoe UI";

    ctx.fillText(
        "Victory",
        40,
        70
    );

    ctx.fillText(
        "Rage",
        40,
        170
    );

    ctx.fillStyle="#facc15";

    ctx.fillRect(
        150,
        40,
        victoryRate*5,
        40
    );

    ctx.fillStyle="#ef4444";

    ctx.fillRect(
        150,
        140,
        rageRate*5,
        40
    );

    ctx.fillStyle="#ffffff";

    ctx.fillText(
        victoryRate + "%",
        160 + victoryRate*5,
        68
    );

    ctx.fillText(
        rageRate + "%",
        160 + rageRate*5,
        168
    );

}
async function registerGame(){

    clickSound();

    const date =
    document.getElementById("date").value;

    const v =
    parseInt(
    document.getElementById(
    "victory"
    ).value
    );

    const r =
    parseInt(
    document.getElementById(
    "rage"
    ).value
    );

    if(
        !date ||
        isNaN(v) ||
        isNaN(r)
    ){
        alert(
        "입력값을 확인해주세요."
        );
        return;
    }

    const existingIndex =

    games.findIndex(
    g=>g.date===date
    );

    let winner;

    if(v > r){

        winner =
        "팀빅토리";

    }
    else if(r > v){

        winner =
        "팀레이지";

    }
    else{

        winner =
        "무승부";

    }

    const gameData = {

        date:date,

        victory:v,

        rage:r,

        winner:winner

    };

    if(
        existingIndex !== -1
    ){

        const modify =
        confirm(
        "이미 존재하는 날짜입니다.\n수정할까요?"
        );

        if(!modify){
            return;
        }

        games[
        existingIndex
        ] = gameData;

    }
    else{

        games.unshift(
        gameData
        );

    }

    saveData();

    const result =
    document.getElementById(
    "result"
    );

    const special =
    document.getElementById(
    "specialMessage"
    );

    result.classList.remove(
    "pop"
    );

    void result.offsetWidth;

    result.classList.add(
    "pop"
    );

    special.innerHTML="";

    if(
        winner===
        "팀빅토리"
    ){

        result.innerHTML =
        "🏆 TEAM VICTORY WIN!";

        result.className =
        "result victory pop";

        await victoryShow();

    }
    else if(
        winner===
        "팀레이지"
    ){

        result.innerHTML =
        "🔥 TEAM RAGE WIN!";

        result.className =
        "result rage pop";

        special.innerHTML =

        `<div class="sad-message">
        😭 팀빅토리...
        다음에는 반드시 이긴다!
        </div>`;

        await rageShow();

    }
    else{

        result.innerHTML =
        "🤝 DRAW";

        result.className =
        "result pop";

        document
        .getElementById(
        "celebrationArea"
        )
        .innerHTML =
        "🤝";

    }

    updateBoard();

}
function updateBoard(){

    const victoryWins =

    games.filter(
    g=>g.winner==="팀빅토리"
    ).length;

    const rageWins =

    games.filter(
    g=>g.winner==="팀레이지"
    ).length;

    const draws =

    games.filter(
    g=>g.winner==="무승부"
    ).length;

    const totalGames =

    victoryWins +

    rageWins;

    const victoryRate =

    totalGames===0

    ? 0

    : Math.round(
    (victoryWins/totalGames)
    *100
    );

    const rageRate =

    totalGames===0

    ? 0

    : Math.round(
    (rageWins/totalGames)
    *100
    );

    document
    .getElementById(
    "victoryWins"
    )
    .innerText =
    victoryWins + "승";

    document
    .getElementById(
    "rageWins"
    )
    .innerText =
    rageWins + "승";

    document
    .getElementById(
    "draws"
    )
    .innerText =
    draws + "회";

    document
    .getElementById(
    "victoryRate"
    )
    .innerText =
    victoryRate + "%";

    document
    .getElementById(
    "rageRate"
    )
    .innerText =
    rageRate + "%";

    document
    .getElementById(
    "streak"
    )
    .innerText =
    calculateCurrentStreak();

    document
    .getElementById(
    "bestStreak"
    )
    .innerText =
    calculateBestStreak()
    + "연승";

    let champion = "동률";

    if(
        victoryWins >
        rageWins
    ){
        champion =
        "🏆 팀빅토리";
    }

    if(
        rageWins >
        victoryWins
    ){
        champion =
        "🔥 팀레이지";
    }

    document
    .getElementById(
    "champion"
    )
    .innerHTML =
    champion;

    drawChart(
        victoryRate,
        rageRate
    );

    const history =

    document
    .getElementById(
    "history"
    );

    history.innerHTML="";

    [...games]

    .sort(
    (a,b)=>

    b.date.localeCompare(
    a.date
    )

    )

    .forEach(g=>{

        history.innerHTML += `

        <tr>

            <td>
                ${g.date}
            </td>

            <td>
                ${g.victory}
                :
                ${g.rage}
            </td>

            <td>
                ${g.winner}
            </td>

            <td>

                <button
                class="deleteBtn"
                onclick="
                deleteGame(
                '${g.date}'
                )
                ">

                🗑️

                </button>

            </td>

        </tr>

        `;

    });

}

updateBoard();

</script>

</body>

</html>
